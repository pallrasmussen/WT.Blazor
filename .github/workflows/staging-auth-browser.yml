name: Authenticated staging browser checks

on:
  workflow_dispatch:
    inputs:
      role:
        description: Windows role represented by the selected runner
        required: true
        type: choice
        options: [Viewer, Contributor, Admin]
      runner_label:
        description: Label of the self-hosted Windows runner using that role's identity
        required: true
        type: string
      base_url:
        description: Isolated staging site URL
        required: true
        type: string
  schedule:
    - cron: "0 5 * * 1-5"

permissions:
  contents: read

jobs:
  viewer:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.role == 'Viewer') ||
      (github.event_name == 'schedule' && vars.STAGING_BROWSER_ENABLED == 'true')
    uses: ./.github/workflows/run-authenticated-staging-browser.yml
    with:
      role: Viewer
      runner_label: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_label || vars.STAGING_VIEWER_RUNNER_LABEL }}
      base_url: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || vars.STAGING_BROWSER_BASE_URL }}

  contributor:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.role == 'Contributor') ||
      (github.event_name == 'schedule' && vars.STAGING_BROWSER_ENABLED == 'true')
    uses: ./.github/workflows/run-authenticated-staging-browser.yml
    with:
      role: Contributor
      runner_label: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_label || vars.STAGING_CONTRIBUTOR_RUNNER_LABEL }}
      base_url: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || vars.STAGING_BROWSER_BASE_URL }}

  admin:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.role == 'Admin') ||
      (github.event_name == 'schedule' && vars.STAGING_BROWSER_ENABLED == 'true')
    uses: ./.github/workflows/run-authenticated-staging-browser.yml
    with:
      role: Admin
      runner_label: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_label || vars.STAGING_ADMIN_RUNNER_LABEL }}
      base_url: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || vars.STAGING_BROWSER_BASE_URL }}
