name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore .\WT.Blazor.Tests\WT.Blazor.Tests.csproj
      - run: .\tests\Test-WithCoverage.ps1 -MinimumLineCoverage 80 -MinimumBranchCoverage 52