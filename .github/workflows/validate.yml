name: Validate

on:
  workflow_call:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - run: dotnet restore .\WT.Blazor.Tests\WT.Blazor.Tests.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=low -warnaserror:NU1901 -warnaserror:NU1902 -warnaserror:NU1903 -warnaserror:NU1904
      - run: dotnet format .\WT.Blazor.csproj --verify-no-changes --no-restore
      - run: dotnet format .\WT.Blazor.Tests\WT.Blazor.Tests.csproj --verify-no-changes --no-restore
      - run: .\tests\Test-WithCoverage.ps1 -MinimumLineCoverage 80 -MinimumBranchCoverage 52
      - run: dotnet restore .\tools\WT.Blazor.Operations\WT.Blazor.Operations.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=low -warnaserror:NU1901 -warnaserror:NU1902 -warnaserror:NU1903 -warnaserror:NU1904
      - run: dotnet format .\tools\WT.Blazor.Operations\WT.Blazor.Operations.csproj --verify-no-changes --no-restore
      - run: dotnet build .\tools\WT.Blazor.Operations\WT.Blazor.Operations.csproj --no-restore
      - run: Invoke-Pester .\tests\DeploymentScripts.Tests.ps1 -EnableExit
      - run: .\tests\Install-PlaywrightBrowsers.ps1
      - run: .\tests\Run-LocalBrowserSmoke.ps1 -WorkPath "${{ runner.temp }}\wt-browser"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-test-results
          path: |
            ${{ runner.temp }}/wt-browser/*.log
            ${{ runner.temp }}/wt-browser/results/*.trx
