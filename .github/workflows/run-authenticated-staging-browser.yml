name: Run authenticated staging browser check

on:
  workflow_call:
    inputs:
      role:
        required: true
        type: string
      runner_label:
        required: true
        type: string
      base_url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, Windows, "${{ inputs.runner_label }}"]
    timeout-minutes: 20
    environment: staging
    env:
      BROWSER_BASE_URL: ${{ inputs.base_url }}
      RUN_AUTH_BROWSER_TESTS: "1"
      STAGING_BROWSER_ROLE: ${{ inputs.role }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-dotnet
      - run: dotnet restore .\WT.Blazor.Tests\WT.Blazor.Tests.csproj
      - run: .\tests\Install-PlaywrightBrowsers.ps1
      - run: dotnet test .\WT.Blazor.Tests\WT.Blazor.Tests.csproj --no-restore --filter "FullyQualifiedName~AuthenticatedStagingBrowserSmokeTests" --logger "trx;LogFileName=staging.trx" --results-directory "${{ runner.temp }}/wt-staging-results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: staging-browser-${{ inputs.role }}
          path: ${{ runner.temp }}/wt-staging-results/*.trx
