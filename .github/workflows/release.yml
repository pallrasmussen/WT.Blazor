name: Release package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.2.0'
        required: true
        type: string
permissions:
  contents: write
  attestations: write
  id-token: write
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  package:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore .\tools\WT.Blazor.Operations\WT.Blazor.Operations.csproj
      - name: Build one package for staging and production
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { $env:GITHUB_REF_NAME -replace '^v', '' }
          .\deploy\Create-Release.ps1 -Version $version -OutputPath "${{ runner.temp }}\wt-release"
      - name: Verify packaged checksums
        run: |
          $package = Get-ChildItem "${{ runner.temp }}\wt-release\*.zip" | Select-Object -First 1
          .\deploy\Expand-Release.ps1 -PackagePath $package.FullName -DestinationPath "${{ runner.temp }}\wt-verified"
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ runner.temp }}/wt-verified
          format: spdx-json
          output-file: ${{ runner.temp }}/wt-release/WT.Blazor.spdx.json
      - name: Attest release package and evidence
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            ${{ runner.temp }}/wt-release/*.zip
            ${{ runner.temp }}/wt-release/*.sha256
            ${{ runner.temp }}/wt-release/*.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WT.Blazor-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/wt-release/*.zip
            ${{ runner.temp }}/wt-release/*.sha256
            ${{ runner.temp }}/wt-release/*.spdx.json
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/wt-release/*.zip
            ${{ runner.temp }}/wt-release/*.sha256
            ${{ runner.temp }}/wt-release/*.spdx.json
