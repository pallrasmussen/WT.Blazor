name: Release package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.2.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  package:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore .\tools\WT.Blazor.Operations\WT.Blazor.Operations.csproj
      - name: Build one package for staging and production
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { $env:GITHUB_REF_NAME -replace '^v', '' }
          .\deploy\Create-Release.ps1 -Version $version -OutputPath "${{ runner.temp }}\wt-release"
      - name: Verify packaged checksums
        run: |
          $package = Get-ChildItem "${{ runner.temp }}\wt-release\*.zip" | Select-Object -First 1
          .\deploy\Expand-Release.ps1 -PackagePath $package.FullName -DestinationPath "${{ runner.temp }}\wt-verified"
      - uses: actions/upload-artifact@v4
        with:
          name: WT.Blazor-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/wt-release/*.zip
            ${{ runner.temp }}/wt-release/*.sha256
