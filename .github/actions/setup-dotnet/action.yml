name: Setup .NET
description: Set up the pinned .NET SDK used by WT.Blazor workflows.

inputs:
  dotnet-version:
    description: .NET SDK version to install
    required: false
    default: 10.0.x

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
